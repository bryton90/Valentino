<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f8e0ff; /* Light lavender background */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* Ensure full viewport height */
            margin: 0; /* Remove default margins */
        }

        h1 {
            color: #d11141; /* Deep pink heading */
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 0 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease; /* Smooth transition */
        }

        #yesButton {
            background-color: #4CAF50; /* Green */
            color: white;
        }

        #yesButton:hover {
            background-color: #45a049;
        }

        #noButton {
            background-color: #f44336; /* Red */
            color: white;
        }

        #noButton:hover {
            background-color: #c9302c;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
            color: #d11141; /* Deep pink message */
        }
    </style>
</head>
<body>

    <h1>Be My Valentine?</h1>

    <button id="yesButton">Yes</button>
    <button id="noButton">No</button>

    <div id="message"></div>

    <script>
        const yesButton = document.getElementById("yesButton");
        const noButton = document.getElementById("noButton");
        const messageDiv = document.getElementById("message");

        yesButton.addEventListener("click", () => {
            messageDiv.textContent = "Yay! I knew you'd say yes! ❤️";
        });

        noButton.addEventListener("click", () => {
            messageDiv.textContent = "Aww, maybe next year! 💔";
        });
    </script>

</body>
</html>
